<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Animation Laboratory</title><link rel="stylesheet" href="/assets/css/book-lab.css"></head><body><main class="lab" data-book-lab data-state="0"><header><h1>Physical Book Animation Laboratory</h1><p>Five sheets. High-contrast faces. No production-book integration.</p></header><div class="lab-scene" aria-label="Interactive physical page-turn test book"><div class="lab-stage" data-stage><div class="sheet sheet-0" data-sheet="0"><div class="face cover front"><b>FRONT COVER</b><span>0F &#8594;</span></div><div class="face inside back"><b>INSIDE FRONT COVER</b><span>0B &#8592;</span></div></div><div class="sheet sheet-1" data-sheet="1"><div class="face page-one front"><b>PAGE 1</b><span>1F &#8594;</span></div><div class="face page-two back"><b>PAGE 2</b><span>1B &#8592;</span></div></div><div class="sheet sheet-2" data-sheet="2"><div class="face page-three front"><b>PAGE 3</b><span>2F &#8594;</span></div><div class="face page-four back"><b>PAGE 4</b><span>2B &#8592;</span></div></div><div class="sheet sheet-3" data-sheet="3"><div class="face page-five front"><b>PAGE 5</b><span>3F &#8594;</span></div><div class="face page-six back"><b>PAGE 6</b><span>3B &#8592;</span></div></div><div class="sheet sheet-4" data-sheet="4"><div class="face inside-back front"><b>INSIDE BACK COVER</b><span>4F &#8594;</span></div><div class="face back-cover back"><b>BACK COVER</b><span>4B &#8592;</span></div></div><div class="spine" aria-hidden="true"></div></div></div><div class="controls"><button data-previous>Previous</button><button data-next>Next</button><button data-reset>Reset</button><label><input type="checkbox" data-slow> Slow motion</label></div><output class="status" data-status aria-live="polite"></output></main><script src="/assets/js/book-lab.js"></script></body></html>
